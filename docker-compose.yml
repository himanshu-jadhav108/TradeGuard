services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - TM_ENV=demo
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - DB_PATH=/app/data/tradeguard.db
    volumes:
      - tradeguard-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  tradeguard-data:
