<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="tg-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="35%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="tg-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Shield Outer Geometry -->
  <path
    d="M 50 12 
       C 68 12 85 18 85 30
       C 85 60 68 80 50 88
       C 32 80 15 60 15 30
       C 15 18 32 12 50 12 Z"
    fill="url(#tg-glow-grad)"
    stroke="url(#tg-shield-grad)"
    stroke-width="5.5"
    stroke-linejoin="round"
  />

  <!-- Three Rising Chart Bars -->
  <!-- Bar 1 (Short) -->
  <rect x="29" y="52" width="6.5" height="15" rx="3.25" fill="url(#tg-shield-grad)" />
  <!-- Bar 2 (Medium) -->
  <rect x="41" y="42" width="6.5" height="25" rx="3.25" fill="url(#tg-shield-grad)" />
  <!-- Bar 3 (Tall) -->
  <rect x="53" y="32" width="6.5" height="35" rx="3.25" fill="url(#tg-shield-grad)" />

  <!-- Dynamic Ascending Swoop Arrow -->
  <path
    d="M 24 64 
       Q 44 68 62 48
       L 76 34"
    stroke="url(#tg-shield-grad)"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Arrowhead pointing up-right -->
  <path
    d="M 64 33
       L 77 33
       L 77 46"
    stroke="url(#tg-shield-grad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>